specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # Elis V1 Factory
  - kind: ethereum
    name: ElisV1Factory
    network: mainnet
    source:
      address: "0x3333333333333333333333333333333333333333"
      abi: ElisV1Factory
      startBlock: 20000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
      abis:
        - name: ElisV1Factory
          file: ../../contracts/evm/out/ElisV1Factory.sol/ElisV1Factory.json
        - name: IERC20
          file: ../../contracts/evm/out/IERC20.sol/IERC20.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handleV1PairCreated
      file: ./src/mappings/factory.ts

  # Elis V2 Factory
  - kind: ethereum
    name: ElisV2Factory
    network: mainnet
    source:
      address: "0x4444444444444444444444444444444444444444"
      abi: ElisV2Factory
      startBlock: 20000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
      abis:
        - name: ElisV2Factory
          file: ../../contracts/evm/out/ElisV2Factory.sol/ElisV2Factory.json
        - name: IERC20
          file: ../../contracts/evm/out/IERC20.sol/IERC20.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint256,address,uint256)
          handler: handleV2PoolCreated
      file: ./src/mappings/factory.ts

  # Elis V3 Factory
  - kind: ethereum
    name: ElisV3Factory
    network: mainnet
    source:
      address: "0x5555555555555555555555555555555555555555"
      abi: ElisV3Factory
      startBlock: 20000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
      abis:
        - name: ElisV3Factory
          file: ../../contracts/evm/out/ElisV3Factory.sol/ElisV3Factory.json
        - name: IERC20
          file: ../../contracts/evm/out/IERC20.sol/IERC20.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handleV3PoolCreated
      file: ./src/mappings/factory.ts

  # Elis Sovereign Treasury
  - kind: ethereum
    name: ElisTreasury
    network: mainnet
    source:
      address: "0x1111111111111111111111111111111111111111"
      abi: ElisTreasury
      startBlock: 20000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TreasuryFeeEvent
        - ElisProtocol
      abis:
        - name: ElisTreasury
          file: ../../contracts/evm/out/ElisTreasury.sol/ElisTreasury.json
      eventHandlers:
        - event: FeeReceived(indexed address,indexed address,uint256)
          handler: handleFeeReceived
      file: ./src/mappings/treasury.ts

templates:
  # Elis V1 Pair Template
  - kind: ethereum
    name: ElisV1Pair
    network: mainnet
    source:
      abi: ElisV1Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - Mint
        - Burn
        - Pool
      abis:
        - name: ElisV1Pair
          file: ../../contracts/evm/out/ElisV1Pair.sol/ElisV1Pair.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleV1Swap
        - event: Sync(uint112,uint112)
          handler: handleV1Sync
      file: ./src/mappings/pool.ts

  # Elis V3 Pool Template
  - kind: ethereum
    name: ElisV3Pool
    network: mainnet
    source:
      abi: ElisV3Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - Mint
        - Burn
        - Pool
      abis:
        - name: ElisV3Pool
          file: ../../contracts/evm/out/ElisV3Pool.sol/ElisV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleV3Swap
      file: ./src/mappings/pool.ts
